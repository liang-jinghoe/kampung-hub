<!-- FE-Req-1, 2, 3: Vehicle List Child Component with Filter Controls and Grid -->
<div class="vehicle-list-wrapper">
  
  <!-- Controls Bar (Search + Filter Tabs + Action Button) -->
  <div class="controls-bar">
    <div class="search-input-wrapper">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input 
        type="text" 
        [(ngModel)]="searchQuery" 
        placeholder="Search by license plate, unit #, or model..." 
        class="form-control search-input"
      />
      <button 
        *ngIf="searchQuery" 
        (click)="searchQuery = ''" 
        class="clear-search-btn" 
        type="button">
        &times;
      </button>
    </div>

    <div class="filter-and-actions">
      <!-- Status Tabs -->
      <div class="status-tabs">
        <button 
          type="button" 
          class="tab-btn" 
          [class.active]="statusFilter === 'ALL'" 
          (click)="setStatusFilter('ALL')">
          All ({{ vehicles.length }})
        </button>
        <button 
          type="button" 
          class="tab-btn" 
          [class.active]="statusFilter === 'ACTIVE'" 
          (click)="setStatusFilter('ACTIVE')">
          Active
        </button>
        <button 
          type="button" 
          class="tab-btn" 
          [class.active]="statusFilter === 'SUSPENDED'" 
          (click)="setStatusFilter('SUSPENDED')">
          Suspended
        </button>
      </div>

      <!-- Add Vehicle Trigger -->
      <button 
        *ngIf="canManage" 
        type="button" 
        class="btn btn-primary" 
        (click)="onCreate()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Register Vehicle</span>
      </button>
    </div>
  </div>

  <!-- Loading State -->
  <div class="loading-state" *ngIf="isLoading">
    <div class="spinner"></div>
    <p>Loading whitelisted vehicles...</p>
  </div>

  <!-- Empty State -->
  <div class="empty-state card" *ngIf="!isLoading && filteredVehicles.length === 0">
    <div class="empty-icon-box">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 17h10M7 7h10M7 12h10"/>
      </svg>
    </div>
    <h3 class="empty-title">No Vehicles Found</h3>
    <p class="empty-desc" *ngIf="searchQuery || statusFilter !== 'ALL'">
      No whitelisted vehicles match your filter criteria "{{ searchQuery }}".
    </p>
    <p class="empty-desc" *ngIf="!searchQuery && statusFilter === 'ALL'">
      There are currently no whitelisted vehicles registered for this community.
    </p>
    <button *ngIf="canManage" type="button" class="btn btn-primary" (click)="onCreate()">
      Register First Vehicle
    </button>
  </div>

  <!-- 3-Tier Grid Rendering Vehicle Cards -->
  <div class="vehicles-grid grid grid-3" *ngIf="!isLoading && filteredVehicles.length > 0">
    <app-vehicle-card
      *ngFor="let vehicle of filteredVehicles"
      [vehicle]="vehicle"
      [canManage]="canManage"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
      (toggleStatus)="onToggleStatus($event)">
    </app-vehicle-card>
  </div>

</div>

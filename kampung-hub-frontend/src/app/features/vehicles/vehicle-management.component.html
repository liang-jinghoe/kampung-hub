<!-- FE-Req-1, 2, 3: Parent Container in 3-Tier Hierarchy for Vehicle Whitelist Management -->
<div class="vehicles-page container">
  
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-left">
      <div class="breadcrumbs">
        <span>Community</span>
        <span>&rsaquo;</span>
        <span class="active">Vehicle Whitelist</span>
      </div>
      <h1 class="page-title">Vehicle Whitelist Directory</h1>
      <p class="page-subtitle">
        Manage automated license plate recognition (ANPR) whitelist access for resident units.
      </p>
    </div>

    <div class="header-right">
      <button type="button" class="btn btn-outline" (click)="loadVehicles()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span>Refresh</span>
      </button>
      <button type="button" class="btn btn-primary" (click)="openCreateModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Register Vehicle</span>
      </button>
    </div>
  </div>

  <!-- Notification Toast -->
  <div class="toast-container" *ngIf="toast">
    <div class="toast" [ngClass]="toast.type === 'success' ? 'toast-success' : 'toast-error'">
      <svg *ngIf="toast.type === 'success'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <svg *ngIf="toast.type === 'error'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>{{ toast.message }}</span>
      <button class="toast-close" (click)="toast = null">&times;</button>
    </div>
  </div>

  <!-- Child Component: Vehicle List (which embeds Grandchild Vehicle Card components) -->
  <app-vehicle-list
    [vehicles]="vehicles"
    [isLoading]="isLoading"
    [canManage]="true"
    (createClick)="openCreateModal()"
    (editVehicle)="openEditModal($event)"
    (deleteVehicle)="handleDelete($event)"
    (toggleStatus)="handleToggleStatus($event)">
  </app-vehicle-list>

  <!-- Vehicle Registration & Edit Modal Form -->
  <app-vehicle-form
    *ngIf="showFormModal"
    [vehicleToEdit]="selectedVehicleForEdit"
    [activeNeighborhoodId]="activeMembership?.neighborhoodId || ''"
    [activeUnitNumber]="activeMembership?.unitNumber || ''"
    [isAdmin]="isAdmin"
    (formSubmit)="handleFormSubmit($event)"
    (cancel)="closeModal()">
  </app-vehicle-form>

</div>
